# Local dev dependencies — Postgres + S3 (MinIO on host :3900).
# Full app: from repo root run `make up`
name: ft_transcendence

services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile
    image: ft_transcendence_postgres:16
    container_name: ft_transcendence_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: transcendence
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: ft_transcendence_minio_dev
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET:-minioadmin}
    ports:
      - "3900:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:9000/minio/health/live || exit 1']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_KEY: ${S3_KEY:-minioadmin}
      S3_SECRET: ${S3_SECRET:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-transcendence}
    volumes:
      - ../docker/minio-init.sh:/minio-init.sh:ro
    entrypoint: ['/bin/sh', '/minio-init.sh']
    restart: 'no'

volumes:
  pgdata:
    name: ft_transcendence_pgdata
  minio_data:
    name: ft_transcendence_minio_dev_data
