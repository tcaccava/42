openapi: 3.0.3
info:
  title: Comments Microservice API
  version: 1.0.0
  description: >-
    API per gestire i commenti dei progetti. Endpoints per lista, creazione,
    aggiornamento e cancellazione. Richiede autenticazione Bearer (JWT/session).

servers:
  - url: https://api.example.com
    description: Production server (replace with your gateway)
  - url: http://localhost:3001
    description: API gateway (local dev)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Comment:
      type: object
      properties:
        id:
          type: string
          example: "c123"
        projectId:
          type: string
          example: "ft_printf"
        userId:
          type: string
          example: "u42"
        login:
          type: string
          example: "mrossi"
        text:
          type: string
          example: "Great job! Learned a lot from this project."
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deleted:
          type: boolean
          default: false
        moderated:
          type: boolean
          default: false
      required: [id, projectId, userId, text, createdAt]

    NewComment:
      type: object
      properties:
        text:
          type: string
          example: "Nice work!"
      required: [text]

    Error:
      type: object
      properties:
        message:
          type: string
          example: "Unauthorized"

  parameters:
    projectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
      description: Project identifier (id or projectName)
    commentId:
      name: commentId
      in: path
      required: true
      schema:
        type: string
      description: Comment identifier

paths:
  /projects/{projectId}/comments:
    get:
      summary: Lista commenti per progetto
      parameters:
        - $ref: '#/components/parameters/projectId'
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Lista commenti
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Comment'
                  total:
                    type: integer
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      summary: Aggiungi un commento a un progetto (autenticato)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/projectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewComment'
      responses:
        '201':
          description: Commento creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          description: Bad request
        '401':
          description: Unauthorized

  /comments/{commentId}:
    put:
      summary: Aggiorna un commento (autore)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/commentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewComment'
      responses:
        '200':
          description: Commento aggiornato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (not author)
        '404':
          description: Not found

    delete:
      summary: Cancella (soft) un commento (autore o moderatore)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/commentId'
      responses:
        '204':
          description: Cancellazione avvenuta (soft delete)
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found

  /projects/{projectId}/comments/moderate:
    post:
      summary: Moderazione bulk (moderator role)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/projectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [flag, approve, remove]
                commentIds:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Moderation applied

components:
  responses:
    NotFound:
      description: Risorsa non trovata
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

tags:
  - name: comments
    description: Operazioni sui commenti
