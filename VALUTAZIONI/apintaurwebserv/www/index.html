<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>webserv</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Syne:wght@400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Syne', sans-serif;
    background: #f5f4f0;
    color: #1a1a18;
    min-height: 100vh;
    padding: 2rem 1rem;
  }

  .wrap {
    max-width: 640px;
    margin: 0 auto;
  }

  .header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 2rem;
  }

  .header-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #378ADD;
    flex-shrink: 0;
  }

  h1 {
    font-size: 20px;
    font-weight: 600;
    color: #1a1a18;
    letter-spacing: -0.3px;
  }

  .host-pill {
    margin-left: auto;
    font-size: 12px;
    color: #5f5e5a;
    border: 0.5px solid #ccc;
    padding: 4px 10px;
    border-radius: 8px;
    font-family: 'JetBrains Mono', monospace;
    background: #fff;
  }

  .section {
    background: #ffffff;
    border: 0.5px solid #d4d3cb;
    border-radius: 12px;
    padding: 1.25rem;
    margin-bottom: 1rem;
  }

  .section-title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: #888780;
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .route-link {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    background: #f5f4f0;
    border: 0.5px solid #d4d3cb;
    border-radius: 8px;
    text-decoration: none;
    color: #1a1a18;
    transition: border-color .15s, background .15s;
  }

  .route-link:hover {
    border-color: #378ADD;
    background: #eef5fc;
  }

  .route-link:hover .route-arrow {
    color: #378ADD;
    transform: translateX(3px);
  }

  .route-icon {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: #fff;
    border: 0.5px solid #d4d3cb;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    color: #378ADD;
    font-size: 16px;
  }

  .route-body { flex: 1; }

  .route-title {
    font-size: 13px;
    font-weight: 600;
    color: #1a1a18;
    margin-bottom: 3px;
  }

  .route-path {
    font-size: 11px;
    color: #888780;
    font-family: 'JetBrains Mono', monospace;
  }

  .badges {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    margin-top: 7px;
  }

  .badge {
    font-size: 9px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 20px;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: .04em;
  }

  .b-get    { background: #EEEDFE; color: #3C3489; }
  .b-post   { background: #E6F1FB; color: #0C447C; }
  .b-put    { background: #EAF3DE; color: #27500A; }
  .b-delete { background: #FCEBEB; color: #791F1F; }
  .b-head   { background: #F1EFE8; color: #2C2C2A; }

  .route-arrow {
    color: #b4b2a9;
    font-size: 18px;
    flex-shrink: 0;
    transition: color .15s, transform .15s;
  }

  .info-row {
    display: flex;
    gap: 8px;
  }

  .info-cell {
    flex: 1;
    background: #f5f4f0;
    border: 0.5px solid #d4d3cb;
    border-radius: 8px;
    padding: 10px 12px;
  }

  .info-cell-label {
    font-size: 10px;
    color: #888780;
    letter-spacing: .08em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .info-cell-value {
    font-size: 13px;
    font-family: 'JetBrains Mono', monospace;
    color: #1a1a18;
    font-weight: 500;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div class="header-dot"></div>
    <h1>webserv</h1>
    <span class="host-pill">127.0.0.1:8080</span>
  </div>

  <div class="section">
    <div class="section-title">
      <i class="ti ti-layout-list" aria-hidden="true"></i>
      routes
    </div>

    <a href="/methods.html" class="route-link">
      <div class="route-icon">
        <i class="ti ti-bolt" aria-hidden="true"></i>
      </div>
      <div class="route-body">
        <div class="route-title">HTTP Methods Demo</div>
        <div class="route-path">/methods.html</div>
        <div class="badges">
          <span class="badge b-get">GET</span>
          <span class="badge b-post">POST</span>
          <span class="badge b-put">PUT</span>
          <span class="badge b-delete">DELETE</span>
          <span class="badge b-head">HEAD</span>
        </div>
      </div>
      <span class="route-arrow">→</span>
    </a>
  </div>

  <div class="section">
    <div class="section-title">
      <i class="ti ti-server" aria-hidden="true"></i>
      server info
    </div>
    <div class="info-row">
      <div class="info-cell">
        <div class="info-cell-label">host</div>
        <div class="info-cell-value">127.0.0.1</div>
      </div>
      <div class="info-cell">
        <div class="info-cell-label">port</div>
        <div class="info-cell-value">8080</div>
      </div>
      <div class="info-cell">
        <div class="info-cell-label">Developed By</div>
        <div class="info-cell-value">apintaur & ahabdelr</div>
      </div>
    </div>
  </div>

</div>
</body>
</html>
