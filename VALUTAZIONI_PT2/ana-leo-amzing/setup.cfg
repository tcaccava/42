# Tool configuration for the linters. flake8 cannot read pyproject.toml,
# so both tools are configured here to keep it in one place.
#
# The Makefile's lint target runs "flake8 ." and "mypy ." over the whole
# repository, which would otherwise walk into the virtualenv and into the
# code shipped with the subject.
#
# docs/manim is left out for the same reason: the scene scripts are
# gitignored drawing aids that import manim, a library neither venv
# has, so every line of them reads as an error here.

[flake8]
max-line-length = 79
exclude =
    .git,
    __pycache__,
    docs/manim,
    .mypy_cache,
    .pytest_cache,
    subject,
    build,
    dist,
    venv,
    .venv

[mypy]
python_version = 3.10
exclude = (?x)(^subject/|^build/|^dist/|^docs/manim/)

# The subject's lint target requires the five flags below. --strict is a
# superset of them and the subject recommends it, so it is the default
# here: the mandatory command still runs verbatim, it just checks more.
strict = True

# Kept explicit so the connection to the subject stays visible.
warn_return_any = True
warn_unused_ignores = True
ignore_missing_imports = True
disallow_untyped_defs = True
check_untyped_defs = True
