[project]
name = "call_me_maybe"
authors = [{ name = "gipimpin" }]
version = "0.1.0"
description = "Function calling with constrained decoding"
requires-python = ">= 3.10"
dependencies = [
    "accelerate>=1.14.0",
    "huggingface-hub>=1.26.1",
    "numpy>=1.24",
    "pydantic>=2.0",
    "torch>=2.13.0",
    "transformers>=5.14.1",
]
 
[dependency-groups]
dev = [
    "flake8>=7.0",
    "mypy>=1.10",
    "pytest>=8.0",
]

[[tool.mypy.overrides]]
module = "llm_sdk.*"
ignore_errors = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
